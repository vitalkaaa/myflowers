<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Мои растения{% endblock %} · my-flowers</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
{% block body %}
  <header class="topbar">
    <a class="logo" href="/"><span class="logo-icon">🌿</span> <span class="logo-text">Дневник растений</span></a>
    <nav>
      <a class="nav-link" href="/" title="Растения">🪴<span class="nav-text"> Растения</span></a>
      <a class="nav-link" href="/calendar" title="Календарь">📅<span class="nav-text"> Календарь</span></a>
      <a class="nav-link" href="/history" title="История">🕓<span class="nav-text"> История</span></a>
      <a class="btn btn-sm" href="/plants/new">＋<span class="nav-text"> Растение</span></a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="btn btn-sm btn-ghost">Выйти</button>
      </form>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
